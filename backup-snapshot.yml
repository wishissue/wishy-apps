name: Update backup snapshot

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  push:
    paths:
      - apps.json
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build apps-backup.json
        run: node scripts/make-backup.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-backup.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update backup snapshot"
            git push
          fi
