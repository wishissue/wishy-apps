<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support Wishissue</title>
  <meta name="description" content="Support Wishissue's free, ad-free apps with a Ko-fi tip or USDT on Tron or Ethereum.">
  <meta property="og:title" content="Support Wishissue">
  <meta property="og:description" content="Support free, ad-free apps with a Ko-fi tip or USDT.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#fef7ff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141218" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%236750a4'/%3E%3Cpath d='M20 22h24v6H20zM20 34h24v6H20z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="donate.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="top">
    <a class="icon-btn" href="index.html" aria-label="Back to apps">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2Z"/></svg>
    </a>
  </header>

  <main id="main" tabindex="-1">
    <h1>Support Wishissue</h1>
    <p class="lede">Free apps with no ads and no tracking. A tip helps keep them that way.</p>

    <section class="goal" aria-labelledby="goal-title">
      <h2 id="goal-title" class="goal-label">Monthly goal <span id="goal-month"></span></h2>
      <p class="goal-amount"><span id="goal-raised">$0</span><span class="of"> of <span id="goal-target">$100</span></span></p>
      <div class="progress" id="meter" role="progressbar" aria-labelledby="goal-title" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-fill" id="meter-fill"></div>
      </div>
      <p class="goal-foot" id="goal-foot"></p>
    </section>

    <div class="actions">
      <a class="btn filled" id="kofi-link" href="https://ko-fi.com/wishismachine" target="_blank" rel="noopener">Support on Ko-fi</a>
      <button class="btn tonal" id="open-crypto" type="button" aria-haspopup="dialog">Donate with crypto</button>
    </div>
  </main>

  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-body">
      <div class="handle" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2 id="sheet-title">Donate USDT</h2>
        <button class="icon-btn" id="close" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41Z"/></svg>
        </button>
      </div>

      <div class="seg" id="seg" role="tablist" aria-label="Network"></div>

      <div class="pay" id="pay" role="tabpanel">
        <div class="qr-wrap"><div class="qr" id="qr"></div></div>
        <p class="net-note" id="net-note"></p>
        <p class="addr" id="addr" tabindex="0" aria-label="Wallet address"></p>
        <button class="btn filled" id="copy" type="button">
          <svg class="ico ico-copy" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1Zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm0 16H8V7h11v14Z"/></svg>
          <svg class="ico ico-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2Z"/></svg>
          <span class="copy-label">Copy address</span>
        </button>
        <p class="min" id="warn-text"></p>
      </div>
    </div>
  </dialog>

  <script src="donate.js" defer></script>
</body>
</html>
